<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoreline Cleanup Data Explorer</title><link rel="stylesheet" href="css/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}#map{position:absolute;inset:0}.p{position:absolute;z-index:1000;top:18px;right:18px;width:355px;max-width:calc(100vw - 36px);background:white;padding:18px;border-radius:16px;box-shadow:0 5px 24px #0003;box-sizing:border-box}h1{font-size:20px;margin:0 0 5px;color:#24324a}.sub{font-size:12px;color:#657086;margin-bottom:14px;line-height:1.35}label{display:block;font-size:11px;font-weight:bold;color:#536078;text-transform:uppercase;margin:12px 0 6px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px}.seg button{border:1px solid #d6dbea;background:#f7f8fb;padding:8px 5px;border-radius:9px;cursor:pointer;font-size:12px}.seg .on{background:#4B5EAA;color:white;border-color:#4B5EAA}select{width:100%;padding:9px;border:1px solid #d6dbea;border-radius:9px;background:white}.yrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legend{margin-top:14px;border-top:1px solid #ddd;padding-top:10px}.r{display:flex;gap:8px;align-items:center;font-size:12px;margin:5px 0}.sw{width:20px;height:12px;border:1px solid #0002;flex:0 0 auto}.note{font-size:11px;color:#727b8e;margin-top:8px;line-height:1.35}.leaflet-popup-content{margin:12px 15px;line-height:1.4}.popname{font-weight:700;font-size:14px;color:#24324a;margin-bottom:5px}.popmetric{font-size:12px;color:#657086}.popval{font-size:20px;font-weight:700;color:#4B5EAA;margin-top:2px}@media(max-width:700px){.p{left:10px;right:10px;top:10px;width:auto;max-height:55vh;overflow:auto}}
</style></head><body><div id="map"></div><div class="p"><h1>Shoreline Cleanup Data Explorer</h1><div class="sub">Explore cleanup activity and shoreline litter across Vancouver neighbourhoods and BC municipalities.</div><label>Geography</label><div class="seg" id="g"><button data-v="van" class="on">Vancouver Neighbourhoods</button><button data-v="bc">BC Municipalities</button></div><label>Metric</label><select id="m"></select><label>Measure</label><div class="seg" id="mseg"><button data-v="mean">Mean per Cleanup</button><button data-v="total" class="on">Total Collected</button></div><label>Years</label><div class="yrs"><select id="ys"></select><select id="ye"></select></div><div id="leg" class="legend"></div><div id="note" class="note"></div></div>
<script src="js/leaflet.js"></script><script src="data/geometry.js"></script><script src="data/summary.js"></script><script>
const Y=[2018,2019,2020,2021,2022,2023,2024,2025],COL=['#DBDFEF','#B7C0DF','#929FCE','#6E7FBC','#4B5EAA'],ND='#d9d9d9';
const F={
'Cleanups Hosted':{f:'Cleanup_Count',total:[2,5,20,100],unit:'cleanups',totalOnly:true},
'Kilograms Collected':{f:'Kilograms',mean:[10,25,50,150],total:[25,100,500,2500],unit:'kg'},
'Cigarette Butts':{f:'Cigarette Butts',mean:[10,50,150,500],total:[50,250,1000,5000],unit:'items'},
'Takeout Containers':{f:'Takeout Containers',mean:[1,2,5,10],total:[5,25,100,500],unit:'items',since:2021},
'Utensils':{f:'Utensils',mean:[1,2,5,10],total:[5,25,100,500],unit:'items'},
'Coffee Cups & Lids':{f:'Coffee Cups & Lids',mean:[2,5,10,25],total:[10,50,250,1000],unit:'items',since:2021},
'6-Pack Holders':{f:'Six Pack Holders',mean:[.5,1,2,5],total:[1,5,25,100],unit:'items'},
'Straws':{f:'Straws',mean:[2,5,10,25],total:[10,50,250,1000],unit:'items'},
'Plastic Bags':{f:'Plastic Bags',mean:[2,5,10,25],total:[10,50,250,1000],unit:'items'} };
let s={g:'van',m:'Cleanups Hosted',mtype:'total',a:2025,b:2025},thematic;
const map=L.map('map',{zoomControl:true}).setView([49.25,-123.12],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function names(){return (s.g==='van'?VAN_GEOMETRY:BC_GEOMETRY).features.map(f=>f.properties.name)}
function val(n){let c=F[s.m],tot=0,num=0,seen=false;for(let y of Y.filter(y=>y>=s.a&&y<=s.b&&(!c.since||y>=c.since))){let p=SHORELINE_SUMMARY[s.g][y]?.[n];if(!p)continue;let q=p['Cleanup_Count_sum'];if(!(typeof q==='number'&&q>0))continue;if(s.m==='Cleanups Hosted'){num+=q;seen=true;continue}let v=p[c.f+'_sum'];if(typeof v==='number'){tot+=v;num+=q;seen=true}}if(!seen)return null;if(s.m==='Cleanups Hosted')return num;return s.mtype==='total'?tot:tot/num}
function ci(v,b){if(v==null)return-1;for(let i=0;i<4;i++)if(v<=b[i])return i;return 4}function fm(v){return v==null?'No Data':(Math.abs(v)>=1000?Math.round(v).toLocaleString():Number(v.toFixed(1)).toLocaleString())}
function breaks(){let c=F[s.m];return c[s.m==='Cleanups Hosted'?'total':s.mtype]}
function ranges(b){return [`0–${b[0]}`,`${b[0]}–${b[1]}`,`${b[1]}–${b[2]}`,`${b[2]}–${b[3]}`,`${b[3]}+`]}
function redraw(fit=false){if(thematic)map.removeLayer(thematic);let geo=s.g==='van'?VAN_GEOMETRY:BC_GEOMETRY,b=breaks();thematic=L.geoJSON(geo,{style:f=>{let v=val(f.properties.name),i=ci(v,b);return{color:'#48505d',weight:s.g==='van'?1.1:.7,opacity:.8,fillColor:i<0?ND:COL[i],fillOpacity:.65}},onEachFeature:(f,l)=>{l.on('click',()=>{let v=val(f.properties.name),measure=s.m==='Cleanups Hosted'?'Total':(s.mtype==='mean'?'Mean per Cleanup':'Total Collected'),yrs=s.a===s.b?String(s.a):`${s.a}–${s.b}`;l.bindPopup(`<div class="popname">${f.properties.name}</div><div class="popmetric">${s.m} · ${measure} · ${yrs}</div><div class="popval">${fm(v)}</div>`).openPopup()})}}).addTo(map);if(fit)map.fitBounds(thematic.getBounds(),{padding:[20,20]});renderLegend()}
function renderLegend(){let b=breaks(),rr=ranges(b),c=F[s.m];document.getElementById('leg').innerHTML='<b style="font-size:12px">'+s.m+'</b>'+rr.map((x,i)=>`<div class="r"><span class="sw" style="background:${COL[i]};opacity:.65"></span>${x}</div>`).join('')+`<div class="r"><span class="sw" style="background:${ND}"></span>No Data</div>`;let n='';if(c.since)n=`${s.m} data begin in ${c.since}; earlier years are excluded from this metric.`;document.getElementById('note').textContent=n}
const m=document.getElementById('m');Object.keys(F).forEach(x=>m.add(new Option(x,x)));m.value=s.m;const ys=document.getElementById('ys'),ye=document.getElementById('ye');Y.forEach(y=>{ys.add(new Option('From '+y,y));ye.add(new Option('To '+y,y))});ys.value=s.a;ye.value=s.b;
document.getElementById('g').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;s.g=e.target.dataset.v;document.querySelectorAll('#g button').forEach(b=>b.classList.toggle('on',b===e.target));redraw(true)});
m.addEventListener('change',()=>{s.m=m.value;if(F[s.m].totalOnly){s.mtype='total';document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',b.dataset.v==='total'))}redraw()});
document.getElementById('mseg').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON'||F[s.m].totalOnly)return;s.mtype=e.target.dataset.v;document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',b===e.target));redraw()});
function years(){let a=+ys.value,b=+ye.value;if(a>b){if(document.activeElement===ys)ye.value=a;else ys.value=b;a=+ys.value;b=+ye.value}s.a=a;s.b=b;redraw()}ys.addEventListener('change',years);ye.addEventListener('change',years);redraw(true);
</script></body></html>
